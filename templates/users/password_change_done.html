{% extends "base.html" %}
{% block title %}Password Updated{% endblock %}

{% block content %}

<style>
.success-box {
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
}

.success-box h3 {
    font-weight: 600;
    margin-bottom: 10px;
}

.success-icon {
    font-size: 60px;
    color: #2ecc71;
    margin-bottom: 15px;
}
</style>

<div class="success-box">
    <div class="success-icon">✔</div>
    <h3>Password Updated Successfully!</h3>
    <p>Your password has been changed.</p>

    <a class="btn btn-primary mt-3" href="{% url 'profile_page' %}">
        Go Back to Profile
    </a>
</div>

{% endblock %}
