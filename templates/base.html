<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}E-Shop{% endblock %}</title>

  {% load static %}

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html, body { height: 100%; }
    body {
      background: #f1f3f6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main.container {
      flex: 1;
    }

    /* ✅ Flipkart Toast Styles */
    .fk-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 12px 22px;
      border-radius: 6px;
      font-size: 15px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
      z-index: 9999;
    }
    .fk-toast.show {
      opacity: 1;
      visibility: visible;
      bottom: 50px;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- 🚀 Django Messages → JSON (Safe conversion) -->
  {% if messages %}
    <script id="django-messages" type="application/json">
    [
      {% for msg in messages %}
        "{{ msg|escapejs }}"{% if not forloop.last %},{% endif %}
      {% endfor %}
    ]
    </script>
  {% endif %}

  <!-- Header -->
  {% include "includes/header.html" %}

  <!-- Page content -->
  <main class="container mt-3 mb-4">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  {% include "includes/footer.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 🚀 Flipkart Toast JS -->
  <script>
    function showToast(text) {
      let t = document.createElement("div");
      t.className = "fk-toast";
      t.textContent = text;
      document.body.appendChild(t);

      setTimeout(() => t.classList.add("show"), 50);

      setTimeout(() => {
        t.classList.remove("show");
        setTimeout(() => t.remove(), 400);
      }, 3000);
    }

    // Read Django messages from JSON safely
    const msgContainer = document.getElementById("django-messages");
    if (msgContainer) {
      try {
        const toastMessages = JSON.parse(msgContainer.textContent);
        toastMessages.forEach(m => showToast(m));
      } catch (error) {
        console.error("Message JSON parse error:", error);
      }
    }
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
